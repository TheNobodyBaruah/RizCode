name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build

      - name: Run backend cargo tests
        run: cargo test --workspace --verbose

      - name: Build Tauri application packages
        working-directory: frontend
        run: npm run tauri build

      - name: Upload Linux desktop packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: code-sandbox-linux
          path: |
            target/release/code-sandbox-app
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload Windows installer and executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: code-sandbox-windows
          path: |
            target/release/code-sandbox-app.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload macOS application bundle and DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: code-sandbox-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: warn
