[package]
name = "code-sandbox-app"
description = "Code Sandbox — a standalone desktop coding sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "code-sandbox-app"

[lib]
name = "code_sandbox_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "code-sandbox-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
sandbox-core = { path = "../sandbox-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
tempfile = "3"
